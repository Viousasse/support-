<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>MyEddy — Mobile</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
body{margin:0;background:var(--surface-subtle);font-family:var(--font-core);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box}
#root{display:flex;gap:28px;align-items:center}
.hint{max-width:280px;font-size:13px;line-height:19px;color:var(--text-muted)}
.hint h1{font-size:19px;line-height:26px;font-weight:800;color:var(--text-title);margin:0 0 10px}
.hint p{margin:0 0 10px}
.hint b{color:var(--text-title)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="MyEddyShell.jsx"></script>
<script type="text/babel" src="MyEddyScreens.jsx"></script>
<script type="text/babel" src="MyEddyDetail.jsx"></script>
<script type="text/babel" src="MyEddyApp.jsx"></script>
<script type="text/babel">
function Page() {
  return (
    <>
      <window.MyEddyApp />
      <div className="hint">
        <h1>MyEddy — gestion documentaire</h1>
        <p>L'écran de lancement bascule seul vers la connexion. <b>Renseignez identifiant et mot de passe</b> pour entrer, ou passez par Microsoft.</p>
        <p>Ensuite : les quatre onglets du bas, <b>Armoires</b> en liste ou en grille, une armoire ouvre ses documents, un document son détail. Le bouton rouge ouvre la feuille d'ajout.</p>
        <p>Application en <b>thème clair</b> ; seuls le lancement et la connexion sont sombres.</p>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
