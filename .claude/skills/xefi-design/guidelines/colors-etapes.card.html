<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-core);background:var(--white);color:var(--text-body)}.w{padding:16px}.n{font-size:11px;color:var(--text-muted);margin-top:6px}.v{font-size:11px;color:var(--text-title)}</style></head><body>
<div class="w" style="display:flex;gap:10px;align-items:center">
<span style="flex:1;text-align:center;background:var(--stage-creation-bg);color:var(--stage-creation-fg);border-radius:var(--radius-pill);height:32px;display:flex;align-items:center;justify-content:center;font-size:14px">Création</span><span style="flex:1;text-align:center;background:var(--stage-validation-bg);color:var(--stage-validation-fg);border-radius:var(--radius-pill);height:32px;display:flex;align-items:center;justify-content:center;font-size:14px">Validation</span><span style="flex:1;text-align:center;background:var(--stage-production-bg);color:var(--stage-production-fg);border-radius:var(--radius-pill);height:32px;display:flex;align-items:center;justify-content:center;font-size:14px">Production</span><span style="flex:1;text-align:center;background:var(--stage-facturation-bg);color:var(--stage-facturation-fg);border-radius:var(--radius-pill);height:32px;display:flex;align-items:center;justify-content:center;font-size:14px">Facturation</span>
</div>
<div class="w n" style="padding-top:0">--stage-*-bg / --stage-*-fg</div></body></html>
