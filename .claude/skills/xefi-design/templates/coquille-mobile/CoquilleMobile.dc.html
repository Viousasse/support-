<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Coquille mobile" description="Safe areas iOS, en-tête, contenu défilant et action pleine largeur en pied." -->
<helmet>
<script src="./ds-base.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}a{color:#1473E6;text-decoration:none}a:hover{color:#0C56B0;text-decoration:underline}:where(button,a,input,select):focus-visible{outline:2px solid #1473E6;outline-offset:2px}</style>
</helmet>
<div style="height:100vh;display:flex;flex-direction:column;background:#FFFFFF;font-family:Lato,system-ui,'Segoe UI',sans-serif;color:#3E3E3E;max-width:430px;margin:0 auto;border-left:1px solid #F2F2F2;border-right:1px solid #F2F2F2">

<div style="height:44px;flex:none"></div>

<header style="display:flex;align-items:center;gap:8px;padding:0 16px 12px;flex:none">
<img src="../../assets/logo/xefi-sans-baseline-rouge-noir.svg" alt="XEFI" style="height:22px;display:block">
<span style="flex:1;min-width:0;font-size:18px;line-height:24px;font-weight:700;color:#2F2F2F">Titre de l'écran</span>
</header>

<main style="flex:1;overflow:auto;padding:0 16px;display:flex;flex-direction:column;gap:12px">

<article style="background:#FFFFFF;border-radius:16px;box-shadow:0 0 8px rgba(112,112,112,0.05);padding:16px">
<div style="font-size:14px;line-height:20px;font-weight:700;color:#2F2F2F">Titre de la carte</div>
<div style="margin-top:2px;font-size:12px;line-height:16px;color:#707070">Information secondaire · 12/06/2026</div>
</article>

<article style="background:#FFFFFF;border-radius:16px;box-shadow:0 0 8px rgba(112,112,112,0.05);padding:16px">
<div style="font-size:14px;line-height:20px;font-weight:700;color:#2F2F2F">Deuxième carte</div>
<div style="margin-top:2px;font-size:12px;line-height:16px;color:#707070">Information secondaire · 11/06/2026</div>
</article>

<article style="background:#FFFFFF;border-radius:16px;box-shadow:0 0 8px rgba(112,112,112,0.05);padding:16px">
<div style="font-size:14px;line-height:20px;font-weight:700;color:#2F2F2F">Troisième carte</div>
<div style="margin-top:2px;font-size:12px;line-height:16px;color:#707070">Information secondaire · 09/06/2026</div>
</article>

</main>

<div style="flex:none;padding:12px 16px;border-top:1px solid #F2F2F2">
<button style="width:100%;height:48px;background:#E10600;border:0;border-radius:8px;color:#FFFFFF;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer">Action principale</button>
</div>

<div style="height:79px;flex:none;display:flex;align-items:flex-start;justify-content:center;padding-top:8px">
<span style="width:134px;height:5px;border-radius:999px;background:#2F2F2F"></span>
</div>
</div>
</x-dc>
</body>
</html>
