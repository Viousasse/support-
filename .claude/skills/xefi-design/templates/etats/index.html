<!-- @template name="États d'écran" description="Chargement, vide, erreur et rempli, commutables par onglets." -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>États d'écran</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}
.h1{font-size:var(--tittle-24-size);line-height:var(--tittle-24-line);font-weight:var(--fw-extrabold);color:var(--text-title);margin:0}
.h3{font-size:var(--tittle-16-size);line-height:var(--tittle-16-line);font-weight:var(--fw-extrabold);color:var(--text-title);margin:0}
.muted{font-size:12px;line-height:16px;color:var(--text-muted)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.wrap{max-width:var(--container-max);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-xl)}
.skel{background:var(--grey-100);border-radius:var(--radius-field);animation:pulse 1.4s var(--ease-standard) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.XEFIDesignSystem_6d8aa5;

const {Sidebar, TopBar, Card, Button, IconButton, Icon, EmptyState, Tabs, DataGrid, Alert, Badge} = NS;
const NAV = [
  {id:"notes", label:"Notes de frais", icon:<Icon name="file-pen-line" size={20}/>},
  {id:"conges", label:"Congés", icon:<Icon name="calendar-days" size={20}/>},
  {id:"annuaire", label:"Annuaire", icon:<Icon name="users" size={20}/>},
  {id:"validation", label:"Validation", icon:<Icon name="shield-check" size={20}/>}
];
const COLS = [{key:"date",header:"DATE",width:120},{key:"libelle",header:"LIBELLÉ"},{key:"montant",header:"MONTANT",align:"right",width:130},{key:"statut",header:"STATUT",width:130}];
const ROWS = [
  {date:"12/06/2026", libelle:"Déjeuner client — Lyon", montant:"48,50 €", statut:"validee"},
  {date:"11/06/2026", libelle:"Billet de train Paris–Lyon", montant:"126,00 €", statut:"soumise"}
];

function Ligne({w="100%", h=14}) { return <span className="skel" style={{display:"block", width:w, height:h}} />; }

function Chargement() {
  return (
    <Card>
      <div className="bar" style={{marginBottom:"var(--space-lg)"}}>
        <Ligne w={180} h={20} /><span className="grow" /><Ligne w={120} h={36} />
      </div>
      <div style={{display:"flex", flexDirection:"column", gap:"var(--space-md)"}}>
        <div style={{display:"grid", gridTemplateColumns:"120px 1fr 130px 130px", gap:"var(--space-lg)", paddingBottom:"var(--space-sm)", borderBottom:"1px solid var(--border-grid)"}}>
          <Ligne w={60} h={10} /><Ligne w={90} h={10} /><Ligne w={70} h={10} /><Ligne w={60} h={10} />
        </div>
        {[0,1,2,3,4].map(i => (
          <div key={i} style={{display:"grid", gridTemplateColumns:"120px 1fr 130px 130px", gap:"var(--space-lg)", alignItems:"center", height:32}}>
            <Ligne w={84} /><Ligne w={i%2 ? "72%" : "56%"} /><Ligne w={70} /><Ligne w={84} h={24} />
          </div>
        ))}
      </div>
    </Card>
  );
}

function Vide() {
  return (
    <Card>
      <EmptyState icon={<Icon name="receipt" size={32}/>} title="Aucune dépense pour cette période"
        description="Créez votre première dépense ou modifiez vos filtres."
        action={<Button variant="primary" size={40} icon={<Icon name="Plus" size={16}/>} iconPosition="left">Créer une dépense</Button>} />
    </Card>
  );
}

function Erreur() {
  return (
    <div style={{display:"flex", flexDirection:"column", gap:"var(--space-lg)"}}>
      <Alert tone="error" title="Chargement impossible">Les dépenses n'ont pas pu être récupérées. Réessayez dans un instant.</Alert>
      <Card>
        <EmptyState icon={<Icon name="WarningStyleOutlined" size={32}/>} title="Données indisponibles"
          description="Le service de notes de frais ne répond pas."
          action={<Button variant="neutral" size={40} icon={<Icon name="Rotate360" size={16}/>} iconPosition="left">Réessayer</Button>} />
      </Card>
    </div>
  );
}

function Rempli() {
  return (
    <Card>
      <div className="bar" style={{marginBottom:"var(--space-lg)"}}>
        <h3 className="h3 grow">Vos dépenses</h3>
        <Button variant="primary" size={36} icon={<Icon name="Plus" size={16}/>} iconPosition="left">Créer</Button>
      </div>
      <DataGrid columns={COLS} rows={ROWS}
        renderCell={(col,row)=> col.key==="statut" ? <Badge status={row.statut} /> : <span className={col.align==="right"?"da-grid--num":""}>{row[col.key]}</span>} />
    </Card>
  );
}

const ETATS = [
  {value:"chargement", label:"Chargement", node:<Chargement/>},
  {value:"vide", label:"Vide", node:<Vide/>},
  {value:"erreur", label:"Erreur", node:<Erreur/>},
  {value:"rempli", label:"Rempli", node:<Rempli/>}
];

function App() {
  const [etat, setEtat] = React.useState("chargement");
  const courant = ETATS.find(e => e.value === etat);
  return (
    <div style={{display:"flex", height:"100vh", overflow:"hidden", background:"var(--surface-page)"}}>
      <Sidebar items={NAV} active="notes" ctaIcon={<Icon name="Plus" size={16}/>} basePath="../../assets" />
      <div style={{flex:1, display:"flex", flexDirection:"column", minWidth:0}}>
        <TopBar title="Notes de frais" basePath="../../assets"
          actions={<IconButton icon={<Icon name="NotificationsStyleOutlined" size={18}/>} label="Notifications" size={36} variant="ghost" />}
          user={<button className="da-topbar__user"><Icon name="AccountOutline" size={20}/>Antoine Fontaine<Icon name="ChevronDown" size={16}/></button>} />
        <div style={{flex:1, overflow:"auto", padding:"var(--page-margin)"}}>
          <div className="wrap">
            <div><h1 className="h1">États de l'écran</h1>
              <div className="muted" style={{marginTop:4}}>Tout écran qui charge des données prévoit ces quatre états. Le squelette pour une liste, le spinner pour une action ponctuelle, le toast pour un succès.</div></div>
            <Tabs tabs={ETATS.map(e => ({label:e.label, value:e.value}))} value={etat} onChange={setEtat} />
            {courant.node}
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
