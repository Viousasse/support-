<!-- @template name="Connexion" description="Aplat noir de marque à gauche, formulaire d'authentification à droite." -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Connexion</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}
.h1{font-size:var(--tittle-24-size);line-height:var(--tittle-24-line);font-weight:var(--fw-extrabold);color:var(--text-title);margin:0}
.h3{font-size:var(--tittle-16-size);line-height:var(--tittle-16-line);font-weight:var(--fw-extrabold);color:var(--text-title);margin:0}
.muted{font-size:12px;line-height:16px;color:var(--text-muted)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.wrap{max-width:var(--container-max);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-xl)}
.skel{background:var(--grey-50);border-radius:var(--radius-field);animation:pulse 1.4s var(--ease-standard) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.XEFIDesignSystem_6d8aa5;

const {Card, Input, Checkbox, Button, Alert, Logo, Icon} = NS;
function App() {
  const [erreur, setErreur] = React.useState(false);
  return (
    <div style={{minHeight:"100vh", display:"grid", gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr)"}}>
      <div style={{background:"var(--xefi-black)", display:"flex", flexDirection:"column", justifyContent:"center", padding:"var(--space-3xl)", gap:"var(--space-xl)"}}>
        <img src="../../assets/logo/xefi-sans-baseline-rouge-blanc.svg" alt="XEFI" style={{width:220, display:"block"}} />
        <div style={{fontFamily:"var(--font-display)", fontSize:"var(--title-h2-size)", lineHeight:"var(--title-h2-line)", fontWeight:700, color:"var(--white)", maxWidth:420}}>
          La suite d'applications métier de votre entreprise.</div>
        <div style={{fontSize:14, lineHeight:20, color:"var(--grey-300)", maxWidth:420}}>
          Notes de frais, congés, annuaire, documents et validation — dans un seul espace.</div>
      </div>
      <div style={{display:"flex", alignItems:"center", justifyContent:"center", padding:"var(--space-3xl)", background:"var(--surface-page)"}}>
        <div style={{width:"100%", maxWidth:400, display:"flex", flexDirection:"column", gap:"var(--space-lg)"}}>
          <Logo variant="mark-wordmark" height={34} basePath="../../assets" />
          <h1 className="h1">Connexion</h1>
          {erreur && <Alert tone="error" title="Identifiants incorrects" onClose={()=>setErreur(false)}>Vérifiez votre adresse et votre mot de passe.</Alert>}
          <Input label="Adresse e-mail" placeholder="prenom.nom@xefi.fr" size={48} type="email" />
          <Input label="Mot de passe" placeholder="Saisissez votre mot de passe" size={48} type="password" />
          <div className="bar" style={{justifyContent:"space-between"}}>
            <Checkbox label="Rester connecté" />
            <a href="#mot-de-passe" style={{fontSize:14}}>Mot de passe oublié ?</a>
          </div>
          <Button block size={48} variant="primary" onClick={()=>setErreur(true)}>Se connecter</Button>
          <div className="muted" style={{textAlign:"center"}}>Un problème de connexion ? Contactez votre administrateur.</div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
