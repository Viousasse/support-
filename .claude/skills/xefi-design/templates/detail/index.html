<!-- @template name="Détail d'un enregistrement" description="En-tête d'objet, onglets, lignes, totaux et volet latéral d'édition." -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Détail</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}
.h1{font-size:var(--tittle-24-size);line-height:var(--tittle-24-line);font-weight:var(--fw-extrabold);color:var(--text-title);margin:0}
.h3{font-size:var(--tittle-16-size);line-height:var(--tittle-16-line);font-weight:var(--fw-extrabold);color:var(--text-title);margin:0}
.muted{font-size:12px;line-height:16px;color:var(--text-muted)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.wrap{max-width:var(--container-max);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-xl)}
.skel{background:var(--grey-50);border-radius:var(--radius-field);animation:p 1.4s var(--ease-standard) infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.45}}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.XEFIDesignSystem_6d8aa5;

const {Sidebar, TopBar, IconButton, Icon} = NS;
const NAV = [
  {id:"notes", label:"Notes de frais", icon:<Icon name="file-pen-line" size={20}/>},
  {id:"conges", label:"Congés", icon:<Icon name="calendar-days" size={20}/>},
  {id:"annuaire", label:"Annuaire", icon:<Icon name="users" size={20}/>},
  {id:"documents", label:"Documents", icon:<Icon name="folder" size={20}/>},
  {id:"validation", label:"Validation", icon:<Icon name="shield-check" size={20}/>},
  {id:"parametrages", label:"Paramétrages", icon:<Icon name="CogOutline" size={20}/>}
];
function Shell({active="notes", title, children, onCta}) {
  const [nav, setNav] = React.useState(active);
  return (
    <div style={{display:"flex", height:"100vh", overflow:"hidden", background:"var(--surface-page)"}}>
      <Sidebar items={NAV} active={nav} onNavigate={setNav} onCta={onCta}
        ctaIcon={<Icon name="Plus" size={16}/>} basePath="../../assets" />
      <div style={{flex:1, display:"flex", flexDirection:"column", minWidth:0}}>
        <TopBar title={title} basePath="../../assets"
          actions={<IconButton icon={<Icon name="NotificationsStyleOutlined" size={18}/>} label="Notifications" size={36} variant="ghost" />}
          user={<button className="da-topbar__user"><Icon name="AccountOutline" size={20}/>Antoine Fontaine<Icon name="ChevronDown" size={16}/></button>} />
        <div style={{flex:1, overflow:"auto", padding:"var(--page-margin)"}}>{children}</div>
      </div>
    </div>
  );
}
const {Card, Badge, Button, Tabs, DataGrid, Avatar, Alert, SidePanel, Input, Select} = NS;
const LIGNES = [
  {date:"12/06/2026", libelle:"Déjeuner client — Lyon", tva:"10 %", ht:"44,09 €", montant:"48,50 €"},
  {date:"11/06/2026", libelle:"Billet de train Paris–Lyon", tva:"5,5 %", ht:"119,43 €", montant:"126,00 €"},
  {date:"09/06/2026", libelle:"Nuit d'hôtel — Bordeaux", tva:"10 %", ht:"171,82 €", montant:"189,00 €"}
];
const COLS = [{key:"date",header:"DATE",width:120},{key:"libelle",header:"LIBELLÉ"},{key:"tva",header:"TVA",width:90},{key:"ht",header:"MONTANT HT",align:"right",width:130},{key:"montant",header:"MONTANT TTC",align:"right",width:140}];
function App() {
  const [onglet, setOnglet] = React.useState("lignes");
  const [volet, setVolet] = React.useState(false);
  return (
    <Shell title="Note en cours">
      <div className="wrap">
        <Alert tone="info" title="Note en cours de saisie">Votre note sera transmise au manager après soumission.</Alert>
        <Card>
          <div className="bar">
            <Avatar initials="AF" size={48} />
            <div className="grow">
              <h1 className="h1">Juin 2026</h1>
              <div className="muted">Antoine Fontaine · XEFI BORDEAUX EST · créée le 02/06/2026</div>
            </div>
            <Badge status="brouillon" />
            <Button variant="neutral" size={40} onClick={()=>setVolet(true)} icon={<Icon name="square-pen" size={16}/>} iconPosition="left">Modifier</Button>
            <Button variant="primary" size={40} icon={<Icon name="send-horizontal" size={16}/>} iconPosition="left">Soumettre la note</Button>
          </div>
        </Card>
        <div style={{display:"grid", gridTemplateColumns:"minmax(0,3fr) minmax(0,1fr)", gap:"var(--space-xl)", alignItems:"start"}}>
          <Card>
            <Tabs tabs={[{label:"Lignes",value:"lignes"},{label:"Justificatifs",value:"justificatifs"},{label:"Historique",value:"historique"}]} value={onglet} onChange={setOnglet} />
            <div style={{marginTop:"var(--space-lg)"}}>
              <DataGrid columns={COLS} rows={LIGNES}
                renderCell={(col,row)=><span className={col.align==="right"?"da-grid--num":""}>{row[col.key]}</span>} />
            </div>
          </Card>
          <div style={{display:"flex", flexDirection:"column", gap:"var(--space-lg)"}}>
            <Card title="Total">
              <div className="bar" style={{justifyContent:"space-between"}}><span className="muted">Montant HT</span><strong>335,34 €</strong></div>
              <div className="bar" style={{justifyContent:"space-between"}}><span className="muted">TVA</span><strong>28,16 €</strong></div>
              <div className="bar" style={{justifyContent:"space-between", marginTop:"var(--space-sm)", paddingTop:"var(--space-sm)", borderTop:"1px solid var(--border-grid)"}}>
                <span className="h3">Montant TTC</span><span className="h3">363,50 €</span></div>
            </Card>
            <Card title="Validation"><div className="muted">En attente de soumission. Le manager sera notifié.</div></Card>
          </div>
        </div>
      </div>
      <SidePanel open={volet} title="Modifier la note" onClose={()=>setVolet(false)}
        footer={<><Button variant="neutral" size={36} onClick={()=>setVolet(false)}>Annuler</Button><Button variant="primary" size={36}>Enregistrer</Button></>}>
        <div style={{display:"flex", flexDirection:"column", gap:"var(--space-lg)"}}>
          <Input label="Période" defaultValue="Juin 2026" size={40} />
          <Select label="Société" options={["XEFI BORDEAUX EST","XEFI LONS"]} value="XEFI BORDEAUX EST" size={40} />
          <Input label="Commentaire" placeholder="Ajouter un commentaire…" size={40} />
        </div>
      </SidePanel>
    </Shell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
