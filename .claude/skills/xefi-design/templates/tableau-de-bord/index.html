<!-- @template name="Tableau de bord" description="Indicateurs, tendance, répartition et liste courte à traiter." -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Tableau de bord</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}
.h1{font-size:var(--tittle-24-size);line-height:var(--tittle-24-line);font-weight:var(--fw-extrabold);color:var(--text-title);margin:0}
.h3{font-size:var(--tittle-16-size);line-height:var(--tittle-16-line);font-weight:var(--fw-extrabold);color:var(--text-title);margin:0}
.muted{font-size:12px;line-height:16px;color:var(--text-muted)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.wrap{max-width:var(--container-max);margin:0 auto;display:flex;flex-direction:column;gap:var(--space-xl)}
.card-fill.da-card{display:flex;flex-direction:column}
.skel{background:var(--grey-50);border-radius:var(--radius-field);animation:p 1.4s var(--ease-standard) infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.45}}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.XEFIDesignSystem_6d8aa5;

const {Sidebar, TopBar, IconButton, Icon} = NS;
const NAV = [
  {id:"notes", label:"Notes de frais", icon:<Icon name="file-pen-line" size={20}/>},
  {id:"conges", label:"Congés", icon:<Icon name="calendar-days" size={20}/>},
  {id:"annuaire", label:"Annuaire", icon:<Icon name="users" size={20}/>},
  {id:"documents", label:"Documents", icon:<Icon name="folder" size={20}/>},
  {id:"validation", label:"Validation", icon:<Icon name="shield-check" size={20}/>},
  {id:"parametrages", label:"Paramétrages", icon:<Icon name="CogOutline" size={20}/>}
];
function Shell({active="notes", title, children, onCta}) {
  const [nav, setNav] = React.useState(active);
  return (
    <div style={{display:"flex", height:"100vh", overflow:"hidden", background:"var(--surface-page)"}}>
      <Sidebar items={NAV} active={nav} onNavigate={setNav} onCta={onCta}
        ctaIcon={<Icon name="Plus" size={16}/>} basePath="../../assets" />
      <div style={{flex:1, display:"flex", flexDirection:"column", minWidth:0}}>
        <TopBar title={title} basePath="../../assets"
          actions={<IconButton icon={<Icon name="NotificationsStyleOutlined" size={18}/>} label="Notifications" size={36} variant="ghost" />}
          user={<button className="da-topbar__user"><Icon name="AccountOutline" size={20}/>Antoine Fontaine<Icon name="ChevronDown" size={16}/></button>} />
        <div style={{flex:1, overflow:"auto", padding:"var(--page-margin)"}}>{children}</div>
      </div>
    </div>
  );
}
const {Card, Badge, Button, StatCard, Sparkline, DataGrid, Progress, Timeline, Avatar} = NS;
const KPI = [
  {label:"Dépenses du mois", value:"12 480,00 €", delta:"+8,2 %", trend:"up", tone:"brand"},
  {label:"Notes à valider", value:"14", delta:"+3", trend:"up", tone:"info"},
  {label:"Délai moyen de validation", value:"2,4 j", delta:"−0,6 j", trend:"down", tone:"success"},
  {label:"Montant refusé", value:"612,40 €", delta:"−12 %", trend:"down", tone:"success"}
];
const ROWS = [
  {collab:"Lorick Vacher", periode:"Juin 2026", montant:"1 250,00 €", statut:"soumise"},
  {collab:"Jérémy Berthon", periode:"Juin 2026", montant:"842,60 €", statut:"soumise"},
  {collab:"Sacha Rosenthal", periode:"Mai 2026", montant:"398,00 €", statut:"corrigee"},
  {collab:"Marie Delaunay", periode:"Mai 2026", montant:"1 704,30 €", statut:"validee"}
];
const COLS = [{key:"collab",header:"COLLABORATEUR"},{key:"periode",header:"PÉRIODE",width:140},{key:"montant",header:"MONTANT",align:"right",width:140},{key:"statut",header:"STATUT",width:130}];
function App() {
  return (
    <Shell title="Statistique">
      <div className="wrap">
        <div className="bar"><h1 className="h1 grow">Vue d'ensemble</h1>
          <Button variant="neutral" size={40} icon={<Icon name="download" size={16}/>} iconPosition="left">Exporter</Button></div>
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:"var(--space-lg)"}}>
          {KPI.map(k => <StatCard key={k.label} label={k.label} value={k.value} delta={k.delta} trend={k.trend} tone={k.tone} />)}
        </div>
        <div style={{display:"grid", gridTemplateColumns:"minmax(0,2fr) minmax(0,1fr)", gap:"var(--space-xl)", alignItems:"stretch"}}>
          <Card title="Dépenses par mois" className="card-fill">
            <div style={{flex:1, minHeight:0, display:"flex", flexDirection:"column"}}>
            <div style={{flex:1, minHeight:110, display:"flex", alignItems:"flex-end", marginTop:"var(--space-lg)"}}><Sparkline data={[820,940,760,1180,1020,1248]} height={110} /></div>
            <div className="bar" style={{justifyContent:"space-between", marginTop:"var(--space-md)"}}>
              {["Jan","Fév","Mar","Avr","Mai","Jui"].map(m => <span key={m} className="muted">{m}</span>)}
            </div>
            </div>
          </Card>
          <Card title="Répartition par catégorie">
            <div style={{display:"flex", flexDirection:"column", gap:"var(--space-md)", marginTop:"var(--space-lg)"}}>
              {[["Repas",42],["Transport",31],["Hébergement",18],["Péage",9]].map(([l,v]) =>
                <div key={l}><div className="bar" style={{justifyContent:"space-between", marginBottom:4}}><span className="muted">{l}</span><span className="muted">{v} %</span></div><Progress value={v} /></div>)}
            </div>
          </Card>
        </div>
        <Card title="À valider">
          <div style={{marginTop:"var(--space-lg)"}}>
            <DataGrid columns={COLS} rows={ROWS}
              renderCell={(col,row)=> col.key==="statut" ? <Badge status={row.statut} />
                : col.key==="collab" ? <span className="bar" style={{gap:8}}><Avatar initials={row.collab.split(" ").map(w=>w[0]).join("")} size={24} />{row.collab}</span>
                : <span className={col.align==="right"?"da-grid--num":""}>{row[col.key]}</span>} />
          </div>
        </Card>
      </div>
    </Shell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
