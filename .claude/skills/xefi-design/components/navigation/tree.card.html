<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--color-background-canvas); font-family: var(--font-sans); }
  .panel { max-width: 360px; background: var(--color-background-surface); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg-px); padding: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Tree, Icon } = window.XEFIDesignSystem_6d8aa5;
function Demo() {
  const [sel, setSel] = React.useState("globex");
  return (
    <div className="panel">
      <Tree selectedId={sel} onSelect={n => setSel(n.id)} defaultExpanded={["clients","globex"]}
        nodes={[
          { id:"clients", label:"Clients", icon:<Icon name="AccountOutline" size={18} />, children:[
            { id:"globex", label:"Globex Corporation", icon:<Icon name="FileSign" size={18} />, children:[
              { id:"g-rapport", label:"Analyse des risques" },
              { id:"g-cr", label:"Comité de direction" },
            ]},
            { id:"orange", label:"ORANGE", icon:<Icon name="FileSign" size={18} /> },
          ]},
          { id:"archive", label:"Archive", icon:<Icon name="History" size={18} /> },
        ]} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
