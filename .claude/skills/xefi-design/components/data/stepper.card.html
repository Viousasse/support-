<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>
  body { margin: 0; padding: 24px; background: var(--color-background-canvas); font-family: var(--font-sans); }
  .panel { background: var(--color-background-surface); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg-px); padding: 20px; margin-bottom: 16px; }

<body>
<div id="root"></div>
<script type="text/babel">
const { Stepper, AvatarGroup, Icon } = window.XEFIDesignSystem_6d8aa5;
const steps = [
  { label: "Création", status: "done", meta: "02 fév", icon: <Icon name="FileSign" size={18} /> },
  { label: "Validation", status: "done", meta: "08 fév", icon: <Icon name="Check" size={18} /> },
  { label: "Production", status: "current", meta: "En cours", icon: <Icon name="CogOutline" size={18} /> },
  { label: "Facturation", status: "pending", meta: "—", icon: <Icon name="CashCheck" size={18} /> },
];
function Demo() {
  const [step, setStep] = React.useState(1);
  return (
    <div>
      <div className="panel"><Stepper steps={steps} /></div>
      <div className="panel"><Stepper current={step} onStepClick={setStep}
        steps={[{label:"Détails", sub:"Client & site"}, "Sujets", "Validation", "Production"]} /></div>
      <div className="panel row">
        <AvatarGroup people={["LV","JB","SR","AL","MD"]} max={3} size="md" />
        <AvatarGroup people={["AB","CD"]} size="sm" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
