<!-- @dsCard group="Components" viewport="700x300" name="Data Table" subtitle="Hairline table composing badges, avatars and row actions" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--color-background-canvas); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Table, Badge, AvatarGroup, ContextualButton } = window.XEFIDesignSystem_6d8aa5;
const rows = [
  { id:1, title:"Analyse des risques", client:"Globex", status:"Validation", tone:"warning", people:["LV","JB","SR"] },
  { id:2, title:"Comité de direction", client:"ORANGE", status:"Production", tone:"info", people:["LV","MD"] },
  { id:3, title:"Synthèse webinaire", client:"Xstream", status:"Facturation", tone:"yes", people:["JB","SR","AL","MD"] },
];
const columns = [
  { key:"title", header:"Rapport", render:r => <span style={{fontWeight:600}}>{r.title}</span> },
  { key:"client", header:"Client" },
  { key:"status", header:"Statut", render:r => <Badge tone={r.tone} dot>{r.status}</Badge> },
  { key:"people", header:"Parties", render:r => <AvatarGroup people={r.people} max={3} /> },
  { key:"actions", header:"", align:"right", render:() => <span style={{display:"inline-flex",gap:4}}><ContextualButton kind="check" size={32} aria-label="Valider" /><ContextualButton kind="note" size={32} aria-label="Note" /></span> },
];
function Demo() { return <Table columns={columns} rows={rows} onRowClick={()=>{}} />; }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
