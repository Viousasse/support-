<!-- @dsCard group="Components" viewport="700x346" name="Contextual Buttons" subtitle="Actions de ligne DailyUp — valider, refuser, historique, note, fermer" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;padding:16px;background:var(--white);font-family:var(--font-core);color:var(--text-body)}
.grid{display:grid;grid-template-columns:78px repeat(5,1fr);gap:10px 8px;align-items:center;justify-items:center}
.grid>.rowlbl{justify-self:start;font-size:11px;font-weight:700;color:var(--text-title)}
.name{font-size:11px;color:var(--text-muted);text-align:center;line-height:14px}
.note{margin-top:14px;font-size:11px;line-height:16px;color:var(--text-muted)}
.demo{display:flex;align-items:center;gap:8px;margin-top:12px;padding:8px 12px;border:1px solid var(--border-subtle);border-radius:var(--radius-field)}
.demo span{font-size:14px;color:var(--text-body)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { ContextualButton } = window.XEFIDesignSystem_6d8aa5;
const KINDS = [
  {kind:"check", label:"Valider"},
  {kind:"close", label:"Refuser"},
  {kind:"history", label:"Historique"},
  {kind:"note", label:"Note"},
  {kind:"window-close", label:"Fermer"}
];
function Demo(){
  return (
    <div>
      <div className="grid">
        <span className="rowlbl"></span>
        {KINDS.map(k => <span key={k.kind} className="name">{k.label}<br/><span style={{color:"var(--text-disabled)"}}>{k.kind}</span></span>)}

        <span className="rowlbl">Défaut</span>
        {KINDS.map(k => <ContextualButton key={k.kind} kind={k.kind} aria-label={k.label} />)}

        <span className="rowlbl">Actif</span>
        {KINDS.map(k => <ContextualButton key={k.kind} kind={k.kind} active aria-label={k.label} />)}

        <span className="rowlbl">Désactivé</span>
        {KINDS.map(k => <ContextualButton key={k.kind} kind={k.kind} disabled aria-label={k.label} />)}
      </div>

      <div className="demo">
        <span style={{flex:1}}>Analyse des risques — Globex</span>
        <ContextualButton kind="check" active aria-label="Valider" />
        <ContextualButton kind="close" aria-label="Refuser" />
        <ContextualButton kind="history" aria-label="Historique" />
        <ContextualButton kind="note" aria-label="Note" />
      </div>

      <div className="note">Boutons-icônes compacts posés en fin de ligne dans les tableaux et les listes DailyUp, pour agir sur l'enregistrement sans quitter la vue. Fond transparent au repos, teinté au survol et à l'état actif selon le ton de l'action — vert pour valider, rouge pour refuser, ambre pour l'historique, gris pour les actions neutres. Reprend le jeu Figma Btn/check · close · history · note · window-close.</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
