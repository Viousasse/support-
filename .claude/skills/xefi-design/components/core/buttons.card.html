<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Boutons</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--white);font-family:var(--font-core)}#root{padding:16px}
.grid{display:grid;grid-template-columns:64px repeat(4,1fr);gap:10px 16px;align-items:center}
.size{font-size:12px;font-weight:var(--fw-extrabold);color:var(--text-title)}
.lbl{font-size:11px;color:var(--text-muted)}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const {Button, Icon} = window.XEFIDesignSystem_6d8aa5;
const SIZES=[30,36,40,48];
const ROWS=[
 {variant:"primary",state:"default",label:"Primaire"},
 {variant:"primary",state:"hover",label:"Primaire · survol"},
 {variant:"primary",disabled:true,label:"Primaire · désactivé"},
 {variant:"outline",state:"default",label:"Contour"},
 {variant:"outline",state:"hover",label:"Contour · survol"},
 {variant:"outline",disabled:true,label:"Contour · désactivé"},
 {variant:"neutral",state:"default",label:"Neutre"},
 {variant:"neutral",state:"hover",label:"Neutre · survol"},
 {variant:"neutral",disabled:true,label:"Neutre · désactivé"},
 {variant:"ghost",state:"default",label:"Texte"},
 {variant:"ghost",state:"hover",label:"Texte · survol"},
 {variant:"ghost",disabled:true,label:"Texte · désactivé"}
];
function Demo(){
  return (<div className="grid">
    <span></span>
    {SIZES.map(s=><span key={s} className="size">{s}px</span>)}
    {ROWS.map((r,i)=>(<React.Fragment key={i}>
      <span className="lbl">{r.label}</span>
      {SIZES.map(s=>(
        <span key={s}>
          <Button variant={r.variant} size={s} state={r.state} disabled={r.disabled}
            icon={<Icon name="Check" size={s<=36?14:16}/>}>Valider</Button>
        </span>
      ))}
    </React.Fragment>))}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
